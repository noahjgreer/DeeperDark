plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+${stonecutter.current.version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

// Version-only classes and resources (whole files that exist on one Minecraft version only)
sourceSets.main {
	java.srcDir rootProject.file("src/main/java-${stonecutter.current.version}")
	resources.srcDir rootProject.file("src/main/resources-${stonecutter.current.version}")
}

loom {
	accessWidenerPath = rootProject.file("src/main/resources/seasons.accesswidener")

	runs.configureEach {
		runDir = "../../run" // shared by every version
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// Versions are in gradle.properties and versions/<minecraft version>/gradle.properties
	minecraft "com.mojang:minecraft:${stonecutter.current.version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// YAML config support - include it in the jar
	include implementation('org.yaml:snakeyaml:2.1')

	compileOnly files(project.compat_jars.split(',').collect { "${rootDir}/libs/$it" })
	localRuntime files(project.dev_mod_jars.split(',').collect { "${rootDir}/libs/$it" })
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft", stonecutter.current.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version, "minecraft": inputs.properties.minecraft
	}

	// Exclude workflow/source files that bloat the jar (mirrors build_resource_pack.py exclusions)
	exclude "**/*.wav", "**/*.aup", "**/*.aup3", "**/*.aup3-shm", "**/*.aup3-wal"
	exclude "**/*.mp3", "**/*.flac", "**/*.au", "**/*.aiff", "**/*.wma", "**/*.m4a", "**/*.opus"
	exclude "**/*.psd", "**/*.xcf", "**/*.ai", "**/*.svg", "**/*.raw"
	exclude "**/*.ase", "**/*.aseprite", "**/*.pdn"
	exclude "**/*.bbmodel", "**/*.blend", "**/*.blend1", "**/*.fbx", "**/*.obj", "**/*.mtl"
	exclude "**/*.bak", "**/*.tmp", "**/*.temp", "**/*.swp", "**/*.swo"
	exclude "**/*.py", "**/*.ps1", "**/*.sh", "**/*.bat", "**/*.cmd"
	exclude "**/*.md", "**/*.log"
	exclude "**/Thumbs.db", "**/.DS_Store", "**/desktop.ini"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	//	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}