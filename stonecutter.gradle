plugins {
	id 'dev.kikugie.stonecutter'
	id 'base'
}

stonecutter.active "26.1.2"

stonecutter.parameters {
	// Renames and moves that keep the call shape (x.setScreen -> x.gui.setScreen). Anything
	// else gets a //? if comment at the use site. A missed site fails the 26.3 compile.
	replacements.string(current.parsed >= "26.3") {
		replace("net.minecraft.world.entity.monster.EnderMan", "net.minecraft.world.entity.monster.Enderman")
		replace("EnderMan.class", "Enderman.class")
		replace("net.minecraft.world.level.block.RedStoneWireBlock;", "net.minecraft.world.level.block.RedstoneWireBlock;")
		replace("RedStoneWireBlock.class", "RedstoneWireBlock.class")
		replace("RedStoneWireBlock.POWER", "RedstoneWireBlock.POWER")
		replace(".hurtMarked", ".syncVelocity")
		replace("net.minecraft.advancements.CriteriaTriggers", "net.minecraft.advancements.triggers.CriteriaTriggers")
		replace("net.minecraft.advancements.criterion.ItemPredicate", "net.minecraft.advancements.predicates.ItemPredicate")
		replace("PushReaction.DESTROY", "PushReaction.POPPED")
		replace("EntityType.PLAYER", "net.minecraft.world.entity.EntityTypes.PLAYER")
		replace("EntityType.ITEM_DISPLAY", "net.minecraft.world.entity.EntityTypes.ITEM_DISPLAY")
		replace("EntityType.CREEPER", "net.minecraft.world.entity.EntityTypes.CREEPER")
		replace("EntityType.LIGHTNING_BOLT", "net.minecraft.world.entity.EntityTypes.LIGHTNING_BOLT")
		replace("EntityType.VILLAGER", "net.minecraft.world.entity.EntityTypes.VILLAGER")
		replace("BlockPos.withinManhattan(", "BlockPos.withinBoxByManhattanDistance(")
		replace(".mulPose(Axis.", ".rotate(Axis.")
		replace(".allItemsCopyStream()", ".itemCopies()")
		replace(".getOptionalParameter(", ".getOptional(")
		replace("LightEngine.getLightBlockInto(", "LightEngine.getLightDampeningInto(")
		replace(".isInstantenous()", ".isInstantaneous()")
		replace("com.mojang.blaze3d.pipeline.BlendFunction", "com.mojang.renderpearl.api.pipeline.BlendFunction")
		replace("com.mojang.blaze3d.pipeline.ColorTargetState", "com.mojang.renderpearl.api.pipeline.ColorTargetState")
		replace("com.mojang.blaze3d.pipeline.RenderPipeline", "com.mojang.renderpearl.api.pipeline.RenderPipeline")
		replace("InputConstants.Type.KEYSYM", "InputConstants.Type.KEYBOARD")
		replace("gameRenderer.getMainCamera()", "gameRenderer.mainCamera()")
		replace("minecraft.setScreen(", "minecraft.gui.setScreen(")
		replace("client.setScreen(", "client.gui.setScreen(")
		replace("mc.setScreen(", "mc.gui.setScreen(")
		replace("client.screen instanceof", "client.gui.screen() instanceof")
		replace("mc.screen instanceof", "mc.gui.screen() instanceof")
		replace("server.getStructureManager()", "server.getStructureTemplateManager()")
	}
}

// ──────────────────────────────────────────────────────────────────────────────
// Bundled jar: every version's jar nested in one outer jar. The nested jars share the mod id
// "deeperdark", so Fabric Loader loads the one whose minecraft dependency matches and skips the
// rest. The outer mod depends on its own "deeperdark" version, so an unsupported Minecraft
// version or a leftover older deeperdark jar fails loudly instead of loading the wrong build.
// ──────────────────────────────────────────────────────────────────────────────
def versionJars = stonecutter.tasks.named('jar', Jar).map { it.values() }

def bundleModJson = tasks.register('bundleModJson') {
	def output = layout.buildDirectory.file('bundle/fabric.mod.json')
	def jarNames = versionJars.map { jars -> jars.collect { it.get().archiveFileName.get() } }
	inputs.property 'version', project.mod_version
	inputs.property 'jarNames', jarNames
	outputs.file output

	doLast {
		output.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
			schemaVersion: 1,
			id           : 'deeperdark_bundle',
			version      : inputs.properties.version,
			name         : 'Deeperdark (bundle)',
			description  : 'Loads the Deeperdark build for the running Minecraft version.',
			license      : 'CC0-1.0',
			environment  : '*',
			jars         : inputs.properties.jarNames.collect { [file: "META-INF/jars/$it"] },
			depends      : [deeperdark: inputs.properties.version],
			custom       : [modmenu: [parent: 'deeperdark']]
		]))
	}
}

// Resources identical in every version jar move to the outer jar once. Fabric API serves the
// outer mod's assets/data like any mod's, so the inner jars only keep what differs.
def bundleSplit = tasks.register('bundleSplit') {
	def sharedDir = layout.buildDirectory.dir('bundle/shared')
	def jarsDir = layout.buildDirectory.dir('bundle/jars')
	def jarFiles = versionJars.map { jars -> jars.collect { it.get().archiveFile.get().asFile } }
	dependsOn versionJars
	inputs.files jarFiles
	outputs.dirs sharedDir, jarsDir

	doLast {
		def jars = jarFiles.get().collect { new java.util.zip.ZipFile(it) }
		try {
			def first = jars[0]
			def shared = first.entries().findAll { e ->
				!e.directory && (e.name.startsWith('assets/') || e.name.startsWith('data/')) &&
						jars.every { j -> j.getEntry(e.name)?.with { it.crc == e.crc && it.size == e.size } }
			}*.name as Set

			[sharedDir, jarsDir].each { it.get().asFile.deleteDir() }
			shared.each { name ->
				def out = sharedDir.get().file(name).asFile
				out.parentFile.mkdirs()
				first.getInputStream(first.getEntry(name)).withCloseable { out.bytes = it.bytes }
			}
			jars.each { jar ->
				def out = jarsDir.get().file(new File(jar.name).name).asFile
				out.parentFile.mkdirs()
				new java.util.zip.ZipOutputStream(out.newOutputStream()).withCloseable { zos ->
					jar.entries().findAll { !(it.name in shared) }.each { e ->
						def copy = new java.util.zip.ZipEntry(e.name)
						copy.time = e.time
						zos.putNextEntry(copy)
						if (!e.directory) jar.getInputStream(e).withCloseable { zos << it }
						zos.closeEntry()
					}
				}
			}
			logger.lifecycle("Bundle: ${shared.size()} shared resources moved to the outer jar")
		} finally {
			jars*.close()
		}
	}
}

def bundleJar = tasks.register('bundleJar', Jar) {
	group = 'build'
	description = 'Nests every version\'s mod jar in one jar.'
	archiveBaseName = project.archives_base_name
	archiveVersion = project.mod_version
	destinationDirectory = layout.buildDirectory.dir('libs')

	from bundleModJson
	from(bundleSplit.map { layout.buildDirectory.dir('bundle/shared') })
	from(bundleSplit.map { layout.buildDirectory.dir('bundle/jars') }) {
		into 'META-INF/jars'
		entryCompression = ZipEntryCompression.STORED // the inner jars are already compressed
	}
	from(file('LICENSE')) { rename { "${it}_${project.archives_base_name}" } }
}

tasks.named('assemble') {
	dependsOn bundleJar
}

// ──────────────────────────────────────────────────────────────────────────────
// GitHub Release task
//
// Usage:
//   gradlew buildGitRelease
//
// Requires a GitHub personal-access-token with the 'repo' scope.
// Provide it via the GITHUB_TOKEN environment variable (recommended) OR by
// placing the token in a .token file at the repo root (single line, gitignored).
//
// Optional project property:
//   -PgithubPreRelease=true   marks the release as a pre-release on GitHub
// ──────────────────────────────────────────────────────────────────────────────
tasks.register('buildGitRelease') {
    group = 'publishing'
    description = 'Builds the bundled mod JAR and publishes it as a GitHub release.'
    dependsOn bundleJar

    doLast {
        // ── 1. Resolve token ─────────────────────────────────────────────────────
        def token = System.getenv('GITHUB_TOKEN')
        if (!token) {
            def tokenFile = rootProject.file('.token')
            if (tokenFile.exists()) {
                token = tokenFile.text
            }
        }
        token = token?.trim()
        if (!token) {
            throw new GradleException(
                'GitHub token not found.\n' +
                'Set the GITHUB_TOKEN environment variable, or create a .token file at the repo\n' +
                'root containing your token on a single line (keep it out of source control).'
            )
        }

        // ── 2. Read remote origin URL from .git/config ───────────────────────────
        def gitConfigFile = rootProject.file('.git/config')
        if (!gitConfigFile.exists()) {
            throw new GradleException("No .git/config found — is this a git repository?")
        }

        def inOrigin = false
        def remoteUrl = null
        for (line in gitConfigFile.readLines()) {
            def trimmed = line.trim()
            if (trimmed == '[remote "origin"]') {
                inOrigin = true
            } else if (trimmed.startsWith('[')) {
                inOrigin = false
            } else if (inOrigin && trimmed.startsWith('url')) {
                remoteUrl = trimmed.replaceFirst(/^url\s*=\s*/, '').trim()
                break
            }
        }
        if (!remoteUrl) {
            throw new GradleException("Could not find 'origin' remote URL in .git/config")
        }

        // ── 3. Extract owner/repo ────────────────────────────────────────────────
        // Handles both https://github.com/owner/repo.git and git@github.com:owner/repo.git
        def repoMatcher = (remoteUrl =~ /github\.com[\/:](.+?)(?:\.git)?$/)
        if (!repoMatcher.find()) {
            throw new GradleException("Remote does not appear to be a GitHub URL: ${remoteUrl}")
        }
        def ownerRepo = repoMatcher.group(1)

        // ── 4. Resolve JAR file and derive names ─────────────────────────────────
        def jarFile = bundleJar.get().archiveFile.get().asFile
        if (!jarFile.exists()) {
            throw new GradleException("JAR not found at: ${jarFile}")
        }
        def releaseName  = jarFile.name - '.jar'
        def tagName      = "v${project.mod_version}"
        def isPreRelease = (project.findProperty('githubPreRelease') ?: 'false').toString().toBoolean()

        logger.lifecycle("Publishing '${releaseName}' → github.com/${ownerRepo}  tag: ${tagName}")

        // ── 5. Create the release ────────────────────────────────────────────────
        def apiBase      = "https://api.github.com/repos/${ownerRepo}"
        def releaseJson  = groovy.json.JsonOutput.toJson([
            tag_name  : tagName,
            name      : releaseName,
            body      : '',
            draft     : false,
            prerelease: isPreRelease
        ])

        def createConn = (HttpURLConnection) new URL("${apiBase}/releases").openConnection()
        createConn.requestMethod = 'POST'
        createConn.setRequestProperty('Authorization',       "Bearer ${token}")
        createConn.setRequestProperty('Content-Type',        'application/json')
        createConn.setRequestProperty('Accept',              'application/vnd.github+json')
        createConn.setRequestProperty('X-GitHub-Api-Version','2022-11-28')
        createConn.setRequestProperty('User-Agent',          'DeeperDark-Gradle')
        createConn.doOutput = true
        createConn.outputStream.withWriter('UTF-8') { it << releaseJson }

        def createStatus = createConn.responseCode
        def createBody   = (createStatus < 400 ? createConn.inputStream : createConn.errorStream)?.text
        createConn.disconnect()

        if (createStatus != 201) {
            throw new GradleException("Release creation failed (HTTP ${createStatus}):\n${createBody}")
        }

        def releaseData = new groovy.json.JsonSlurper().parseText(createBody)
        def uploadBase  = releaseData.upload_url.replaceAll(/\{[^}]+\}$/, '')
        logger.lifecycle("Release created (id=${releaseData.id}). Uploading JAR...")

        // ── 6. Upload the JAR as a release asset ─────────────────────────────────
        def encodedName = URLEncoder.encode(jarFile.name, 'UTF-8')
        def uploadConn  = (HttpURLConnection) new URL("${uploadBase}?name=${encodedName}").openConnection()
        uploadConn.requestMethod = 'POST'
        uploadConn.setRequestProperty('Authorization',       "Bearer ${token}")
        uploadConn.setRequestProperty('Content-Type',        'application/octet-stream')
        uploadConn.setRequestProperty('Accept',              'application/vnd.github+json')
        uploadConn.setRequestProperty('X-GitHub-Api-Version','2022-11-28')
        uploadConn.setRequestProperty('User-Agent',          'DeeperDark-Gradle')
        uploadConn.setFixedLengthStreamingMode(jarFile.length())
        uploadConn.doOutput = true

        jarFile.withInputStream { is ->
            def out = uploadConn.outputStream
            def buf = new byte[65536]
            int n
            while ((n = is.read(buf)) != -1) out.write(buf, 0, n)
            out.flush()
        }

        def uploadStatus = uploadConn.responseCode
        def uploadBody   = (uploadStatus < 400 ? uploadConn.inputStream : uploadConn.errorStream)?.text
        uploadConn.disconnect()

        if (uploadStatus != 201) {
            throw new GradleException("JAR upload failed (HTTP ${uploadStatus}):\n${uploadBody}")
        }

        def assetData = new groovy.json.JsonSlurper().parseText(uploadBody)
        logger.lifecycle("Done!")
        logger.lifecycle("  Release : ${releaseData.html_url}")
        logger.lifecycle("  Download: ${assetData.browser_download_url}")
    }
}
